html, body {
  background: #060606 !important;
  background-color: #060606 !important;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  cursor: none;
  position: relative;
}

/* Cursor */
.cursor {
  position: fixed;
  width: 8px; height: 8px;
  background: #f0ede6;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed;
  width: 32px; height: 32px;
  border: 1px solid rgba(240,237,230,0.4);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
}

/* Radial rings — sonic pulse */
.rings {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(240,237,230,0.07);
  animation: expand linear infinite;
}

.ring:nth-child(1) { width: 200px; height: 200px; animation-duration: 4s; animation-delay: 0s; }
.ring:nth-child(2) { width: 200px; height: 200px; animation-duration: 4s; animation-delay: 0.8s; }
.ring:nth-child(3) { width: 200px; height: 200px; animation-duration: 4s; animation-delay: 1.6s; }
.ring:nth-child(4) { width: 200px; height: 200px; animation-duration: 4s; animation-delay: 2.4s; }
.ring:nth-child(5) { width: 200px; height: 200px; animation-duration: 4s; animation-delay: 3.2s; }

@keyframes expand {
  0%   { transform: scale(0.5); opacity: 0.6; }
  100% { transform: scale(8);   opacity: 0; }
}

/* Waveform bars */
.wave-bars {
  position: fixed;
  left: 0; right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  animation: fadeIn 2s ease 1.8s forwards;
}

.bar {
  width: 2px;
  background: rgba(240,237,230,0.1);
  border-radius: 1px;
  animation: pulse var(--dur) ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes pulse {
  from { height: 2px; }
  to   { height: var(--max-h); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Center content */
.center {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.rule {
  width: 0;
  height: 1px;
  background: rgba(240,237,230,0.3);
  animation: growRule 1.2s cubic-bezier(0.76,0,0.24,1) 0.6s forwards;
  margin: 20px 0;
}

@keyframes growRule {
  from { width: 0; }
  to   { width: 100%; }
}

h1 {
  font-family: 'Syncopate', sans-serif;
  font-weight: 700;
  font-size: clamp(2rem, 7vw, 7rem);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #f0ede6;
  line-height: 1;
  opacity: 0;
  animation: revealText 1.6s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  position: relative;
}

h1::before {
  content: 'SENSEAXIA';
  position: absolute;
  inset: 0;
  color: #f0ede6;
  clip-path: inset(0 100% 0 0);
  animation: shimmer 6s ease 2.5s infinite;
  letter-spacing: 0.3em;
}

@keyframes shimmer {
  0%   { clip-path: inset(0 100% 0 0); opacity: 0.6; }
  8%   { clip-path: inset(0 0% 0 0);   opacity: 0.3; }
  10%  { clip-path: inset(0 100% 0 0); opacity: 0; }
  100% { clip-path: inset(0 100% 0 0); opacity: 0; }
}

@keyframes revealText {
  from { opacity: 0; letter-spacing: 0.6em; }
  to   { opacity: 1; letter-spacing: 0.3em; }
}

/* Frequency dots */
.freq-dots {
  display: flex;
  gap: 6px;
  margin-top: 4px;
  opacity: 0;
  animation: fadeIn 1s ease 2.2s forwards;
}

.freq-dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: rgba(240,237,230,0.35);
  animation: dotPulse 1.8s ease-in-out infinite alternate;
}
.freq-dot:nth-child(1) { animation-delay: 0s; }
.freq-dot:nth-child(2) { animation-delay: 0.2s; }
.freq-dot:nth-child(3) { animation-delay: 0.4s; }
.freq-dot:nth-child(4) { animation-delay: 0.6s; }
.freq-dot:nth-child(5) { animation-delay: 0.8s; }
.freq-dot:nth-child(6) { animation-delay: 0.6s; }
.freq-dot:nth-child(7) { animation-delay: 0.4s; }
.freq-dot:nth-child(8) { animation-delay: 0.2s; }
.freq-dot:nth-child(9) { animation-delay: 0s; }

@keyframes dotPulse {
  from { opacity: 0.2; transform: scaleY(1); }
  to   { opacity: 0.9; transform: scaleY(3); }
}

<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <div class="wave-bars" id="waveBars"></div>

  <div class="center">
    <div class="rule"></div>
    <h1>Senseaxia</h1>
    <div class="freq-dots">
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
      <div class="freq-dot"></div>
    </div>
    <div class="rule"></div>
  </div>

  <script>
    // Cursor
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx+'px'; cursor.style.top = my+'px';
    });
    (function animRing() {
      rx += (mx-rx)*0.1; ry += (my-ry)*0.1;
      ring.style.left = rx+'px'; ring.style.top = ry+'px';
      requestAnimationFrame(animRing);
    })();

    // Waveform bars — bell curve shape
    const container = document.getElementById('waveBars');
    const count = Math.floor(window.innerWidth / 6);
    for (let i = 0; i < count; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const center = count / 2;
      const dist = Math.abs(i - center) / center;
      const maxH = Math.max(4, Math.round((1 - dist * dist) * 130)) + 'px';
      bar.style.setProperty('--max-h', maxH);
      bar.style.setProperty('--dur', (1.2 + Math.random() * 1.8).toFixed(2) + 's');
      bar.style.setProperty('--delay', (Math.random() * 2).toFixed(2) + 's');
      bar.style.height = '2px';
      container.appendChild(bar);
    }
  </script>

</body>
